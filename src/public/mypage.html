<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>越境EC商品発見支援サービス - マイページ</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<nav>
  <a id="backLink" href="/search.html">検索画面に戻る</a>
</nav>

<h1>マイページ</h1>
  
  <div id="results"></div>
  <p id="empty" style="display:none;">まだお気に入りがありません。</p>

  <script>
    async function loadFavorites() {
      const res = await fetch('/api/favorites');

      if (!res.ok) {
        alert('ログインが必要です');
        window.location.href = '/login.html';
        return;
      }

      const favorites = await res.json();
      const resultsDiv = document.getElementById('results');
      const emptyMsg = document.getElementById('empty');
      resultsDiv.innerHTML = '';

      if (favorites.length === 0) {
        emptyMsg.style.display = 'block';
        return;
      }
      emptyMsg.style.display = 'none';

      favorites.forEach(fav => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="info">
            <a href="${fav.url}" target="_blank">${fav.site_name}</a>
            <span class="keyword">検索キーワード: ${fav.keyword}</span>
          </div>
          <button class="delete" data-id="${fav.id}">☓</button>
        `;
        resultsDiv.appendChild(card);
      });

      document.querySelectorAll('.delete').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id = btn.dataset.id;
          const res = await fetch(`/api/favorites/${id}`, { method: 'DELETE' });
          if (res.ok) {
            alert('お気に入りから削除しました');
            loadFavorites();
          }
        });
      });
    }

    loadFavorites();
  </script>
</body>
</html>
