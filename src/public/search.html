<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>越境EC商品発見支援サービス - 検索</title>
 <link rel="stylesheet" href="/style.css">
</head>
<body>
<nav>
  <a href="/help.html">ヘルプ</a>
  <a href="/mypage.html">マイページ</a>
  <button id="logoutBtn">ログアウト</button>
</nav>

<h1>商品を探す</h1>

  <div id="searchBox">
    <input type="text" id="keyword" placeholder="例: ナイキ スニーカー 限定">
    <button id="searchBtn">検索</button>
  </div>

  <div id="results"></div>

  <script>
    const siteNames = {
      yahooAuction: "ヤフオク!",
      ebaySold: "eBay(過去の落札)",
      mercari: "メルカリ",
      amazon: "Amazon",
      rakuten: "楽天市場"
    };

    document.getElementById('searchBtn').addEventListener('click', async () => {
      const keyword = document.getElementById('keyword').value;
      if (!keyword) return;

      const res = await fetch(`/api/search?keyword=${encodeURIComponent(keyword)}`);
      const urls = await res.json();

      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = '';

      for (const key in urls) {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <a href="${urls[key]}" target="_blank">${siteNames[key] || key} で見る</a>
          <button class="heartBtn" data-url="${urls[key]}" data-site="${siteNames[key] || key}">♡</button>
        `;
        resultsDiv.appendChild(card);
      }

      document.querySelectorAll('.heartBtn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const res = await fetch('/api/favorites', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              keyword,
              url: btn.dataset.url,
              siteName: btn.dataset.site
            })
          });
          if (res.ok) {
            btn.textContent = '♥';
            btn.disabled = true;
            alert('お気に入りに登録されました、マイページからいつでもご確認できます');
          } else {
            alert('ログインが必要です');
          }
        });
      });
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = '/login.html';
    });
  </script>
</body>
</html>
