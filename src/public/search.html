<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Item Journal - 検索</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .trustBadge {
      font-size: 0.75em;
      padding: 2px 8px;
      border-radius: 3px;
      margin-left: 8px;
    }
    .trust-trusted { background: #e3f0e3; color: #2d6a2d; }
    .trust-unknown { background: #f0ecdd; color: #8a6d1d; }
    .trust-risky { background: #fbe4e2; color: #B23A2E; font-weight: bold; }
    .snippet { font-size: 0.85em; color: #706a5a; margin-top: 4px; }
    .cardMain { display: flex; flex-direction: column; flex: 1; }
    .oldResultsTitle { font-size: 1em; margin-top: 32px; }
    #loading { display: none; color: #706a5a; margin: 12px 0; }
    #searchBox { flex-wrap: wrap; }

    #marketBtn {
      background: var(--stamp-red);
      color: var(--paper);
      border: none;
      padding: 0 20px;
      font-family: 'Shippori Mincho', serif;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    #marketBtn:hover {
      background: #8f2e24;
    }
    #marketBtn:active {
      transform: scale(0.96);
    }
    #marketBtn.loading {
      background: #706a5a;
      cursor: wait;
    }

    .priceCard {
      border: 2px solid var(--navy);
      background: #fff;
      padding: 18px;
      margin-bottom: 20px;
    }
    .priceRange {
      font-family: 'Shippori Mincho', serif;
      font-size: 1.4em;
      color: var(--stamp-red);
      margin: 8px 0;
    }
    .priceMeta {
      font-size: 0.85em;
      color: #706a5a;
      margin-bottom: 4px;
    }
    .priceError {
      color: var(--stamp-red);
    }
  </style>
</head>
<body>
  <nav>
    <a href="/help.html">ヘルプ</a>
    <a href="/mypage.html">マイページ</a>
    <button id="logoutBtn">ログアウト</button>
  </nav>

  <h1>商品を探す</h1>

  <div id="searchBox">
    <input type="text" id="keyword" placeholder="例: ナイキの限定スニーカーが欲しい">
    <button id="searchBtn">検索</button>
    <button id="marketBtn">相場</button>
  </div>

  <div id="priceResult"></div>

  <div id="loading">検索中です、少々お待ちください…</div>

  <div id="smartResults"></div>

  <h2 class="oldResultsTitle">過去の相場をチェック</h2>
  <div id="auctionResults"></div>

  <script>
    const siteNames = {
      yahooAuction: "ヤフオク!",
      ebaySold: "eBay(過去の落札)",
      mercari: "メルカリ",
      amazon: "Amazon",
      rakuten: "楽天市場"
    };

    const trustLabels = {
      trusted: "信頼できるサイト",
      unknown: "情報の少ないサイト",
      risky: "⚠️信頼性の低いサイトの可能性があります"
    };

    document.getElementById('searchBtn').addEventListener('click', async () => {
      const keyword = document.getElementById('keyword').value;
      if (!keyword) return;

      const loading = document.getElementById('loading');
      const smartResultsDiv = document.getElementById('smartResults');
      const auctionResultsDiv = document.getElementById('auctionResults');
      loading.style.display = 'block';
      smartResultsDiv.innerHTML = '';
      auctionResultsDiv.innerHTML = '';

      try {
        const smartRes = await fetch('/api/smart-search', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: keyword })
        });
        const smartData = await smartRes.json();

        smartData.results.forEach(item => {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <div class="cardMain">
              <a href="${item.url}" target="_blank">${item.title}</a>
              <span class="trustBadge trust-${item.trust}">${trustLabels[item.trust] || item.trust}</span>
              <div class="snippet">${item.snippet}</div>
            </div>
            <button class="heartBtn" data-url="${item.url}" data-site="${item.title}">♡</button>
          `;
          smartResultsDiv.appendChild(card);
        });

        attachHeartHandlers(keyword);
      } catch (err) {
        smartResultsDiv.innerHTML = '<p>検索に失敗しました。</p>';
      }

      loading.style.display = 'none';

      const res = await fetch(`/api/search?keyword=${encodeURIComponent(keyword)}`);
      const urls = await res.json();

      for (const key in urls) {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <a href="${urls[key]}" target="_blank">${siteNames[key] || key} で見る</a>
          <button class="heartBtn" data-url="${urls[key]}" data-site="${siteNames[key] || key}">♡</button>
        `;
        auctionResultsDiv.appendChild(card);
      }
      attachHeartHandlers(keyword);
    });

    // ---- 新機能: 相場チェック ----
    document.getElementById('marketBtn').addEventListener('click', async () => {
      const keyword = document.getElementById('keyword').value;
      if (!keyword) return;

      const marketBtn = document.getElementById('marketBtn');
      const priceResultDiv = document.getElementById('priceResult');
      marketBtn.classList.add('loading');
      marketBtn.textContent = '調査中…';
      marketBtn.disabled = true;
      priceResultDiv.innerHTML = '';

      try {
        const res = await fetch('/api/market-price', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: keyword })
        });
        const data = await res.json();

        if (!data.sufficient) {
          priceResultDiv.innerHTML = `<div class="priceCard priceError">${data.message}</div>`;
        } else {
          const low = data.priceRangeLow.toLocaleString();
          const high = data.priceRangeHigh.toLocaleString();
          priceResultDiv.innerHTML = `
            <div class="priceCard">
              <div class="priceMeta">発売時期: ${data.releaseDate || '不明'} / 発売元: ${data.manufacturer || '不明'}</div>
              <div>${data.description || ''}</div>
              <div class="priceRange">${low}円 〜 ${high}円</div>
              <div class="priceMeta">${data.note || ''}</div>
            </div>
          `;
        }
      } catch (err) {
        priceResultDiv.innerHTML = '<div class="priceCard priceError">相場の取得に失敗しました。</div>';
      }

      marketBtn.classList.remove('loading');
      marketBtn.textContent = '相場';
      marketBtn.disabled = false;
    });

    function attachHeartHandlers(keyword) {
      document.querySelectorAll('.heartBtn:not([data-bound])').forEach(btn => {
        btn.setAttribute('data-bound', 'true');
        btn.addEventListener('click', async () => {
          const res = await fetch('/api/favorites', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              keyword,
              url: btn.dataset.url,
              siteName: btn.dataset.site
            })
          });
          if (res.ok) {
            btn.textContent = '♥';
            btn.disabled = true;
            alert('お気に入りに登録されました、マイページからいつでもご確認できます');
          } else {
            const data = await res.json();
            alert(data.error);
          }
        });
      });
    }

    async function showExchangeRate() {
      const res = await fetch('/api/exchange-rate');
      const data = await res.json();
      const rate = data.usdToJpy.toFixed(2);
      const rateDiv = document.createElement('div');
      rateDiv.style.fontSize = '0.85em';
      rateDiv.style.color = '#706a5a';
      rateDiv.style.marginBottom = '16px';
      rateDiv.textContent = `参考為替レート: 1ドル ≒ ${rate}円(送料・関税別)`;
      document.querySelector('h1').insertAdjacentElement('afterend', rateDiv);
    }

    showExchangeRate();

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = '/login.html';
    });
  </script>
</body>
</html>
